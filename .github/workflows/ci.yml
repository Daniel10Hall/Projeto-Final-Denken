name: CI OrbitBoard

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Validar backend
    runs-on: ubuntu-latest

    steps:
      - name: Obter código-fonte
        uses: actions/checkout@v6

      - name: Configurar .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Restaurar dependências
        run: dotnet restore backend/PulseDesk.Api.csproj

      - name: Compilar backend
        run: >
          dotnet build
          backend/PulseDesk.Api.csproj
          --configuration Release
          --no-restore

  frontend:
    name: Validar frontend
    runs-on: ubuntu-latest

    steps:
      - name: Obter código-fonte
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Compilar frontend
        working-directory: frontend
        run: npm run build

  docker:
    name: Validar containers
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    steps:
      - name: Obter código-fonte
        uses: actions/checkout@v6

      - name: Validar Docker Compose
        run: docker compose config

      - name: Construir imagens
        run: docker compose build