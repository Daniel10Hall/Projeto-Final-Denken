version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: pulsedesk-backend

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

    ports:
      - "5200:8080"

    restart: unless-stopped

    networks:
      - pulsedesk-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5200

    container_name: pulsedesk-frontend

    depends_on:
      - backend

    ports:
      - "5173:80"

    restart: unless-stopped

    networks:
      - pulsedesk-network

networks:
  pulsedesk-network:
    driver: bridge